name: Quality Gate
run-name: "Quality Gate ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
  pull_request:
  push:
    branches:
      - develop

  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

permissions:
  contents: read
  id-token: write
env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash

    steps:
      - uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          lfs: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        continue-on-error: true
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::warning::CURIOSITY_ROOT unset in this step - in a container job the observables install on the host"; exit 1; }
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Poetry virtual environment
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-quality-py3.12-${{ hashFiles('poetry.lock') }}

      - name: Install poetry and dependencies
        uses: ./.github/actions/bootstrap-poetry
        with:
          os: linux
          install-args: --only main,lint,test

      - name: Install Linux prerequisites
        run: poetry run ./scripts/install_linux_prereqs.sh

      - name: Install Linux test prerequisites
        run: sudo apt-get install -y xvfb libgl1 libgles2 libmtdev1

      - name: Run quality hooks
        continue-on-error: true   # racecar: scan/report/push step, must not fail the build
        run: poetry run pre-commit run --all-files

      - name: Run tests
        run: xvfb-run -a -s "-screen 0 1920x1080x24 -nolisten tcp" poetry run python -m pytest tests
